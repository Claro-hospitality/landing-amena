# Deploy a producción (canal live del site amena-principal → amena.social)
# cada vez que se hace push a main.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Sin estas variables el bundle sale con `undefined` y src/lib/supabase.ts lanza al
          # importarse: el sitio se despliega EN BLANCO, incluidas las páginas de marketing
          # (main.tsx importa todas las páginas de forma estática). Van como secrets del repo.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SINERGYPAY_PUBLIC_KEY: ${{ secrets.VITE_SINERGYPAY_PUBLIC_KEY }}

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMENA_20DF0 }}
          projectId: amena-20df0
          channelId: live
